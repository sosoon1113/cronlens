[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cronlens"
dynamic = ["version"]
description = "Explain, preview and audit cron schedules from your terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sosoon1113" }]
requires-python = ">=3.10"
keywords = ["cron", "crontab", "scheduler", "cli", "devops", "timezone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    # Windows has no system timezone database for zoneinfo.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
cronlens = "cronlens.cli:main"

[project.urls]
Homepage = "https://github.com/sosoon1113/cronlens"
Issues = "https://github.com/sosoon1113/cronlens/issues"
Changelog = "https://github.com/sosoon1113/cronlens/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/cronlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cronlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cronlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
