[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cronlens"
dynamic = ["version"]
description = "Explain, preview and audit cron schedules from your terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sosoon1113" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    # Windows has no system timezone database for zoneinfo.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cronlens = "cronlens.cli:main"

[project.urls]
Homepage = "https://github.com/sosoon1113/cronlens"

[tool.hatch.version]
path = "src/cronlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cronlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
